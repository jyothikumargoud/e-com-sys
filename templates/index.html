<!DOCTYPE html>
<html>
<head>
    <title>B2B Competitor Dashboard</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <h1>E-Commerce Competitor Monitoring Dashboard</h1>

    <table>
        <tr>
            <th>Product</th>
            <th>Price</th>

        </tr>

        {% for product in products %}
        <tr>
            <td>{{ product[0] }}</td>
            <td>${{ product[1] }}</td>

        </tr>
        {% endfor %}

    </table>

</body>
</html>
